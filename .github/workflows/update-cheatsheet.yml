name: Update MyCashflow cheat sheet

on:
  schedule:
    # Joka maanantai klo 04:17 UTC (~07:17 Suomen aikaa).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheatsheet-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-teemaopas.txt

      - name: Install Python dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-teemaopas.txt

      - name: Install Playwright browsers
        working-directory: scripts
        run: python -m playwright install --with-deps chromium

      - name: Scrape teemaopas (write to temp file)
        id: scrape
        working-directory: scripts
        continue-on-error: true
        run: |
          python scrape_teemaopas.py \
            --out teemaopas-full.tmp.json \
            --max-pages 1500 \
            --delay 0.25 \
            --min-tags 120
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Bail out if scrape failed or returned too little data
        id: gate
        working-directory: scripts
        run: |
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "Scrape step did not succeed (outcome=${{ steps.scrape.outcome }}). Skipping update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s teemaopas-full.tmp.json ]; then
            echo "Temp JSON is missing or empty. Skipping update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os, sys
          data = json.loads(open("teemaopas-full.tmp.json", encoding="utf-8").read())
          count = data.get("tag_page_count", 0)
          print(f"tag_page_count={count}")
          if count < 120:
              print("Too few tag pages, skipping update.", file=sys.stderr)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
              sys.exit(0)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=false\n")
          PY

      - name: Promote temp JSON and rebuild HTML
        if: steps.gate.outputs.skip != 'true'
        working-directory: scripts
        run: |
          mv teemaopas-full.tmp.json teemaopas-full.json
          mkdir -p ../docs
          python build_teemaopas_cheatsheet.py \
            --input teemaopas-full.json \
            --output ../docs/index.html \
            --updated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          touch ../docs/.nojekyll

      - name: Clean up temp on skip
        if: steps.gate.outputs.skip == 'true'
        working-directory: scripts
        run: rm -f teemaopas-full.tmp.json

      - name: Commit and push if changed
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll scripts/teemaopas-full.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(cheatsheet): weekly auto-update $(date -u +%Y-%m-%d)"
            git push
          fi
